<ion-header>

  <ion-toolbar color="primary">
    <ion-buttons slot="end">
      <ion-button (click)="add()" fill="outline">
        <ion-icon slot="icon-only" name="add"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Expense Inquiry</ion-title>
  </ion-toolbar>
  <ion-toolbar>
    <ion-item>
      <ion-input label="Display Mode" label-placement="floating" type="text" [(ngModel)]="displayMode"></ion-input>
      <ion-button (click)="udcSearch('09E','RD')">
        <ion-icon name="search-outline"></ion-icon>
      </ion-button>
    </ion-item>
    <ion-item>
      <ion-input label="Report Type" label-placement="floating" [(ngModel)]="repType"></ion-input>
      <ion-button (click)="udcSearch('09E','RT')">
        <ion-icon name="search-outline"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card (click)="getexpensequery(items)" *ngFor="let items of expQuery">
    <ion-item-divider color="light"
      style="border-radius: 10px 10px 10px 10px;">{{items.reportStatus}}</ion-item-divider>
    <div>
      <ion-item style="border-radius: 10px 10px 10px 10px;">
        <ion-grid>
          <ion-row>
            <ion-col size="3" style="font-weight: bold;">Report #:</ion-col>
            <ion-col size="4" style="font-weight: bold;">Date:</ion-col>
            <ion-col style="font-weight: bold;">Total Expense:</ion-col>
          </ion-row>
          <ion-row>
            <ion-col size="3">{{items.eReportNumber}}</ion-col>
            <ion-col size="4">{{items.eReportDate}}</ion-col>
            <ion-col>{{items.totalExpense|number}}</ion-col>
          </ion-row>
        </ion-grid>
      </ion-item>
    </div>
  </ion-card>

  <ion-infinite-scroll threshold="100px" (ionInfinite)="loadData($event)" [disabled]="numTimesLeft <= 0">
    <ion-infinite-scroll-content loadingSpinner="bubbles" loadingText="Loading more data...">
    </ion-infinite-scroll-content>
  </ion-infinite-scroll>

</ion-content>

<ion-footer>
  <ion-item class="ion-text-center">
    <ion-label>
      <ion-button shape="round" expand="full" size="default" (click)="expquerysearch()">Search</ion-button>
    </ion-label>
  </ion-item>
</ion-footer>
